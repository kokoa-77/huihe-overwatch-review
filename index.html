<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111a2c" />
    <meta name="description" content="给每一场对局留下一点复盘，让下一场更有把握。" />
    <title>回合 · 守望先锋 2 训练与复盘</title>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      window.addEventListener("error", (event) => {
        console.error(event.error || event.message);
        const app = document.querySelector("#app");
        if (app && !app.innerHTML.trim()) app.innerHTML = '<div style="margin:3rem auto;max-width:38rem;padding:1.5rem;font:14px sans-serif;color:#667085">演示页面暂时无法加载，请刷新页面后再试。</div>';
      });
    </script>
    <script defer src="./src/demo-repository.js"></script>
    <script defer src="./src/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </body>
</html>
